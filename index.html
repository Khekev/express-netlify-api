
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motor de Métricas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #171717;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #8b5cf6;
        }

        button {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        #resultado {
            margin: 20px auto;
            max-width: 800px;
            white-space: pre-wrap;
            text-align: left;
            background: #262626;
            padding: 20px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <h1>Motor de Métricas</h1>

    <p>Prueba de telemetría con Netlify Blobs</p>

    <button onclick="registrarMetrica('tofu_attraction')">
        Registrar Atracción
    </button>

    <button onclick="registrarMetrica('mofu_landing')">
        Registrar Visita
    </button>

    <button onclick="registrarMetrica('bofu_interaction')">
        Registrar Interacción
    </button>

    <button onclick="registrarMetrica('bofu_cross_promo')">
        Registrar Clic a Aliado
    </button>

    <button onclick="registrarMetrica('feedback_submission')">
        Registrar Feedback
    </button>

    <br>

    <button onclick="consultarMetricas()">
        Consultar Métricas
    </button>

    <button onclick="exportarCSV()">
        Descargar CSV
    </button>

    <div id="resultado">Esperando acción...</div>

    <script>
        // ==================================
        // IDENTIFICAR SESIÓN
        // ==================================

        let sessionId = null;

        try {
            sessionId = sessionStorage.getItem("demo_session_id");

            if (!sessionId) {
                sessionId = crypto.randomUUID();
                sessionStorage.setItem("demo_session_id", sessionId);
            }
        } catch (error) {
            // Si el navegador bloquea el almacenamiento, se usa un ID temporal
            sessionId = sessionId || "anon_" + Date.now();
        }

        // ==================================
        // OBTENER PARÁMETROS UTM
        // ==================================

        const parametrosURL = new URLSearchParams(window.location.search);

        const utmSource = parametrosURL.get("utm_source") || "directo";
        const utmMedium = parametrosURL.get("utm_medium") || "ninguno";
        const utmCampaign = parametrosURL.get("utm_campaign") || "ninguna";

        // ==================================
        // TIPO DE DISPOSITIVO
        // ==================================

        function tipoDispositivo() {
            return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
                ? "mobile"
                : "desktop";
        }

        // ==================================
        // MOSTRAR RESULTADOS (solo para pruebas)
        // ==================================

        function mostrarResultado(resultado) {
            document.getElementById("resultado").textContent =
                JSON.stringify(resultado, null, 2);
        }

        // ==================================
        // ENVIAR MÉTRICA (silencioso y no bloqueante)
        // ==================================

        async function enviarMetrica(paso) {
            try {
                const respuesta = await fetch("/api/metrics", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        step: paso,
                        source: utmSource,
                        sessionId: sessionId,
                        metadata: {
                            utm_source: utmSource,
                            utm_medium: utmMedium,
                            utm_campaign: utmCampaign,
                            device: tipoDispositivo()
                        }
                    }),
                    keepalive: true // La petición termina aunque el usuario cambie de página
                });

                return await respuesta.json();

            } catch (error) {
                console.warn("Telemetría no enviada:", error);
                return {
                    status: "error",
                    message: "No se pudo registrar la métrica.",
                    details: error.message
                };
            }
        }

        // ==================================
        // REGISTRAR MÉTRICA DESDE LOS BOTONES
        // ==================================

        async function registrarMetrica(paso) {
            const resultado = await enviarMetrica(paso);
            mostrarResultado(resultado);
        }

        // ==================================
        // CONSULTAR MÉTRICAS
        // ==================================

        async function consultarMetricas() {
            try {
                const respuesta = await fetch("/api/metrics");
                const resultado = await respuesta.json();

                mostrarResultado(resultado);

            } catch (error) {
                mostrarResultado({
                    status: "error",
                    message: "No se pudieron consultar las métricas.",
                    details: error.message
                });
            }
        }

        // ==================================
        // EXPORTAR CSV
        // ==================================

        function exportarCSV() {
            window.location.href = "/api/metrics/export?format=csv";
        }

        // ==================================
        // REGISTRAR VISITA AUTOMÁTICA (sin mostrar nada al usuario)
        // ==================================

        window.addEventListener("DOMContentLoaded", () => {
            enviarMetrica("mofu_landing");
        });
    </script>

</body>
</html>
